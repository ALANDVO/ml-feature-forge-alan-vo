services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3;cat <&3 | grep -q '200 OK' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      APP_HOST: "0.0.0.0"
      APP_PORT: 8000
      APP_DEMO_MODE: "true"
      DATABASE_PATH: "/data/feature_forge.db"
      OIDC_ISSUER_URL: "http://127.0.0.1:8080/realms/feature-forge"
      OIDC_CLIENT_ID: "feature-forge-client"
      OIDC_AUDIENCE: "feature-forge-client"
      LLM_PROVIDER: "openai-compatible"
      LLM_API_KEY: ""
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - keycloak

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - backend

volumes:
  keycloak_data:
  backend_data:
