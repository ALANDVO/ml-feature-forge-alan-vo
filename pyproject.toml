[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-feature-forge-alan-vo"
version = "1.3.0"
description = "ML feature engineering toolkit that auto-generates candidate transforms, evaluates importance, and outputs production pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "python-jose[cryptography]>=3.3.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[project.scripts]
ml-feature-forge = "main:main"
